# Convention from ML_DM_Implementation_Roadmap.md, section 5.
project_name: diabetes-classification
dataset:
  source_url: https://archive.ics.uci.edu/dataset/891/cdc+diabetes+health+indicators
  path: data/raw/diabetes.csv
  version: uci891_binary_imbalanced  # tương đương diabetes_binary_health_indicators_BRFSS2015 + cột ID của UCI
  sha256: 9f71fda9d4ae5f4878c99b9233b6a16accfa9a17c194116a6b78100540934964
  target_column: Diabetes_binary
  positive_label: 1
  label_meaning: "0 = không tiểu đường; 1 = tiền tiểu đường hoặc tiểu đường"
  # M02 đã xác nhận: 21 predictor sau khi bỏ cột ID do UCI thêm.
  feature_columns:
    - HighBP
    - HighChol
    - CholCheck
    - BMI
    - Smoker
    - Stroke
    - HeartDiseaseorAttack
    - PhysActivity
    - Fruits
    - Veggies
    - HvyAlcoholConsump
    - AnyHealthcare
    - NoDocbcCost
    - GenHlth
    - MentHlth
    - PhysHlth
    - DiffWalk
    - Sex
    - Age
    - Education
    - Income
split:
  test_size: 0.2
  stratify: true
  random_state: 42
cv:
  strategy: StratifiedKFold
  n_splits: 5
  shuffle: true
  random_state: 42
training:
  primary_metric: average_precision
  metrics: [accuracy, precision, recall, f1, roc_auc, average_precision]
  threshold_policy: default_baseline_then_validation_only
  test_policy: final_evaluation_only
paths:
  processed: data/processed
  splits: data/splits
  metrics: results/metrics
  figures: results/figures
  artifacts: artifacts
